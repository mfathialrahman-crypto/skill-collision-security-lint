[project]
name = "skill-collision-security-lint"
version = "0.1.0"
description = "Independent Collision Detector + Security Lint for Agent Skills"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "mfathialrahman-crypto"}]
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
skill-lint = "skill_lint.cli:main"
skill-collision = "skill_collision.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
